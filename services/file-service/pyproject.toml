[project]
name = "unified-file-service"
version = "0.1.0"
description = "File upload, virus scanning, and storage service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.19",
    "aio-pika>=9.5.0",
    "minio>=7.2.10",
    "pillow>=11.0.0",
    "python-magic>=0.4.27; sys_platform != 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

