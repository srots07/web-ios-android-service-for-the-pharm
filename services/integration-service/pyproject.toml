[project]
name = "unified-integration-service"
version = "0.1.0"
description = "Third-party integrations service (WhatsApp, OAuth, OTP, Email, Webhooks)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "aio-pika>=9.5.0",
    "redis>=5.2.0",
    "authlib>=1.3.2",
    "aiosmtplib>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

