[project]
name = "unified-notification-service"
version = "0.1.0"
description = "Multi-channel push (FCM/APNs), in-app, and event notifications service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "aio-pika>=9.5.0",
    "redis>=5.2.0",
    "firebase-admin>=6.6.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

